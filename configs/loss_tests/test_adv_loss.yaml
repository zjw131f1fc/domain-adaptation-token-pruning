# 测试 Adversarial Loss 收敛性
# 只启用 adv_loss，其他 loss 权重为 0

method_settings:
  adv_loss_weight_start: 1.0
  adv_loss_weight: 1.0
  # 弱化判别器，让 pruner 有机会学习
  disc_reinit_prob: 0.3  # 30% 概率重初始化判别器
  disc_dropout: 0.4  # 更高的 dropout

trainer_settings:
  dl_settings:
    optimizers:
      discriminator:
        lr: 5.0e-05  # 降低判别器学习率，与 pruner 接近

global_settings:
  save_dir: "./outputs/loss_tests/adv_loss"
  log_dir: "./outputs/loss_tests/adv_loss/logs"
