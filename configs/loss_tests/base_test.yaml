# Loss 收敛测试 - 基础配置
# 其他测试配置会覆盖这里的 loss 权重

global_settings:
  seed: 42
  device: "cuda"
  dtype: "float"
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  dataset_cache_dir: "/root/autodl-tmp/dataset_cache"
  hf_cache_dir: "/root/autodl-tmp/huggingface_cache"
  save_dir: "./outputs/loss_tests"
  log_dir: "./outputs/loss_tests/logs"
  study_name: "loss_test"

trainer_settings:
  type: "deep-learning"
  name: "basic-pytorch"
  dl_settings:
    epochs: 1
    batch_size: 2
    optimizers:
      generator:
        type: "adam"
        lr: 2.0e-05
      discriminator:
        type: "adam"
        lr: 3.2e-04
      token_merger:
        type: "adam"
        lr: 1.0e-05
      layer_pruners:
        type: "adam"
        lr: 1.7e-05
    print_loss_every_batches: 20
    eval_every_batches: 99999
    save_every_batches: 99999
    save_every_epochs: 99999
    grad_clip_max_norm: 1.0

manager_settings:
  name: "basic"
  mode: "direct"
  num_subtasks: 1
  available_gpus: [0]
  gpus_per_subtask: 1
  poll_interval: 5.0

search_settings:
  enable: false

dataset_settings:
  name: "vqa-vqav2"
  split:
    train: 500
    test: 100
  category_priority:
    enable: false
  fast_load_no_random: true

config_settings:
  enable_dict_overrides: true
  enable_yaml_overrides: true
  log_config_on_load: false

backbone_settings:
  type: "mllm"
  name: "llava-1.5-7b"
  mllm_settings:
    device_map: "cuda:0"
    max_text_tokens: 128
    max_vision_tokens: 576
    image_max_size: 336

method_settings:
  enable_token_merger: false
  merger_type: "fixed_pooling"
  merge_ratio: 1.0
  merger_dropout: 0.1
  merger_d_internal: 512

  pruning_layers: [5, 15, 25]
  pruner_d_internal: 512
  pruner_num_heads: 4
  pruner_type: "cross_attention"
  pruner_dropout: 0.1

  use_attn_residual: false
  attn_residual_weight: 0.5
  learnable_attn_weight: false

  use_token_num_target: true
  target_token_num: 200
  target_sparsity: 0.3

  sparsity_loss_only_on_excess: true
  sparsity_warmup_enable: false
  sparsity_weight: 0.0
  sparsity_weight_max: 0.0
  sparsity_warmup_ratio: 0.0
  token_count_loss_weight: 0.0
  binarization_loss_weight: 0.0

  temperature: 0.8
  temperature_min: 0.2
  temperature_anneal_rate: 0.4

  hard_pruning_threshold: 0.5

  gen_num_layers: 2
  gen_num_heads: 2
  gen_d_ff: 2048
  gen_use_pos_encoding: false
  gen_enable_token_bias: true
  gen_use_gumbel: true
  gen_temperature: 0.906
  gen_temperature_anneal: true
  gen_temperature_min: 0.237
  gen_temperature_anneal_rate: 0.543

  disc_num_layers: 3
  disc_d_d: 512
  disc_dropout: 0.15
  disc_target_layers: [-1, -3, -5]
  disc_reinit_prob: 0.0
  disc_use_spectral_norm: false

  task_loss_weight_start: 0.0
  task_loss_weight: 0.0
  adv_loss_weight_start: 0.0
  adv_loss_weight: 0.0
  entropy_weight: 0.0
  loss_weight_warmup_ratio: 0.0

evaluation_settings:
  eval_mode: ["origin"]
