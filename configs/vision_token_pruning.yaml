# Vision Token Pruning with GAN 配置文件
# 基于ATP-LLaVA参数，针对GAN训练特点调整

debug_adv_grad: false

global_settings:
  seed: 42
  device: "cuda"
  dtype: "float"
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  dataset_cache_dir: "/root/autodl-tmp/dataset_cache"
  hf_cache_dir: "/root/autodl-tmp/huggingface_cache"
  save_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  study_name: "gan_vtp"

trainer_settings:
  type: "deep-learning"
  name: "basic-pytorch"
  dl_settings:
    epochs: 2
    batch_size: 12
    optimizers:
      # ===== 学习率设计思路 =====
      # ATP-LLaVA: LLM=2e-5, ATP Module=1e-4
      # 但我们冻结LLM，只训练Pruner和Discriminator
      # GAN训练原则：D学习率通常为G的1-2倍，但不能太高否则D过强

      generator:  # 遗留配置，未使用
        type: "adam"
        lr: 2.0e-05
      discriminator:
        type: "adam"
        lr: 1.5e-04  # Pruner的1.5倍，让D稍微领先但不过强
      token_merger:  # 未启用
        type: "adam"
        lr: 1.0e-04
      layer_pruners:
        type: "adam"
        lr: 1.0e-04  # 参考ATP-LLaVA的ATP Module学习率
    print_loss_every_batches: 50
    eval_every_batches: 500
    eval_max_samples: 400
    save_every_batches: 3000
    save_every_epochs: 1
    optuna_eval_interval_batches: 40
    grad_clip_max_norm: 1.0

manager_settings:
  name: "basic"
  mode: "direct"
  num_subtasks: 1
  available_gpus: [0]
  gpus_per_subtask: 1
  poll_interval: 5.0
  batch_configs_dir: null

search_settings:
  enable: false
  type: "optuna"
  n_trials: 100
  study_name: "atp_search"
  pruner:
    type: "successive_halving"
    min_resource: 2
    reduction_factor: 3
    min_early_stopping_rate: 0
  sampler:
    type: "tpe"
    n_startup_trials: 10
    multivariate: true
  params:
    trainer_settings.dl_settings.optimizers.layer_pruners.lr:
      type: "float"
      low: 5.0e-5
      high: 3.0e-4
      log: true

    trainer_settings.dl_settings.optimizers.discriminator.lr:
      type: "float"
      low: 5.0e-5
      high: 5.0e-4
      log: true

    method_settings.sparsity_weight:
      type: "float"
      low: 0.1
      high: 0.5
      log: false

    method_settings.atp_loss_weight:
      type: "float"
      low: 0.01
      high: 0.1
      log: true

    method_settings.task_loss_weight:
      type: "float"
      low: 0.5
      high: 2.0
      log: false

    method_settings.adv_loss_weight:
      type: "float"
      low: 0.3
      high: 1.5
      log: false

    method_settings.disc_reinit_prob:
      type: "float"
      low: 0.0
      high: 0.2
      log: false

    method_settings.disc_dropout:
      type: "float"
      low: 0.1
      high: 0.4
      log: false

    method_settings.temperature:
      type: "float"
      low: 0.5
      high: 2.0
      log: false

    method_settings.temperature_min:
      type: "float"
      low: 0.1
      high: 0.5
      log: false

dataset_settings:
  name: "vqa-vqav2"
  split:
    train: 50000
    test: 5000
  category_priority:
    enable: false
    values:
      - train: "mean"
  fast_load_no_random: false

config_settings:
  enable_dict_overrides: true
  enable_yaml_overrides: true
  log_config_on_load: true

backbone_settings:
  type: "mllm"
  name: "llava-1.5-7b"
  mllm_settings:
    device_map: "auto"
    max_text_tokens: 128
    max_vision_tokens: 576
    image_max_size: 336

method_settings:
  # ==================== Layer-wise Pruner配置 ====================
  pruning_layers: [5, 15, 25]
  pruner_d_internal: 512
  pruner_num_heads: 4
  pruner_type: "cross_attention"
  pruner_dropout: 0.1

  # Attention Residual配置
  use_attn_residual: false
  attn_residual_weight: 0.5
  learnable_attn_weight: true

  # ==================== 剪枝目标配置 ====================
  use_token_num_target: true
  target_token_num: 200  # ATP-LLaVA: 144 (~75%压缩)
  target_sparsity: 0.75

  # ==================== Sparsity Loss配置 ====================
  # ATP-LLaVA: λ_target=0.2, λ_ATP=0.01-0.1 (相对于L_ntp=1)
  sparsity_loss_only_on_excess: false
  sparsity_warmup_enable: false
  sparsity_weight: 4.0  # 提高以增加剪枝量
  sparsity_weight_max: 4.0
  sparsity_warmup_ratio: 0.0
  atp_loss_weight: 1.0  # 提高以鼓励早期剪枝

  # ==================== Temperature配置 ====================
  temperature: 1.5  # Gumbel-Softmax 适用
  temperature_min: 0.8
  temperature_anneal_rate: 0.5

  # ==================== Hard Pruning配置 ====================
  hard_pruning_threshold: 0.5

  # ==================== Discriminator配置 ====================
  disc_num_layers: 3
  disc_d_d: 512
  disc_dropout: 0.2
  disc_target_layers: [8, 18, 28]
  disc_reinit_prob: 0.1  # 防止D过强
  disc_use_spectral_norm: false

  # ==================== 损失权重设计 ====================
  # 设计思路：
  # - ATP-LLaVA只有L_ntp作为主损失，我们有task_loss + adv_loss
  # - task_loss对应L_ntp，是保持任务性能的关键
  # - adv_loss是GAN信号，确保剪枝后表示质量
  # - 两者需要平衡：task_loss太大会忽略GAN，adv_loss太大会忽略任务

  task_loss_weight_start: 1.5
  task_loss_weight: 1.5  # 提高以优先保证任务性能

  adv_loss_weight_start: 0.5
  adv_loss_weight: 0.5  # 比task_loss小，优先保证任务性能

  loss_weight_warmup_ratio: 0.0  # 关闭动态调度，先用固定权重调试

  # 遗留配置（未使用）
  enable_token_merger: false
  merger_type: "fixed_pooling"
  merge_ratio: 1.0
  merger_dropout: 0.1
  merger_d_internal: 512
  entropy_weight: 0.0
  gen_num_layers: 2
  gen_num_heads: 2
  gen_d_ff: 2048
  gen_use_pos_encoding: false
  gen_enable_token_bias: true
  gen_use_gumbel: true
  gen_temperature: 1.0
  gen_temperature_anneal: true
  gen_temperature_min: 0.5
  gen_temperature_anneal_rate: 0.5

evaluation_settings:
  eval_mode: ["origin", "hard"]
