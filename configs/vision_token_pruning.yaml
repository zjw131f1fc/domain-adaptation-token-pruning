# Attention Consistency Pruning 配置文件
# 基于 attention 聚合一致性的视觉 token 剪枝

global_settings:
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  dataset_cache_dir: "/data/users/zjw/dataset_cache"
  hf_cache_dir: "/data/users/zjw/huggingface_cache"
  save_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  # Checkpoint 路径（用于恢复训练或评估）
  # 训练时：如果指定则从该 checkpoint 恢复训练
  # 评估时：必须指定，否则报错（也可通过命令行 --checkpoint 覆盖）
  checkpoint: null
  # 加载 checkpoint 时是否重置 step 计数（用于在新数据集上微调时重新开始退火）
  reset_step_on_load: true

config_settings:
  # 每次启动都把整份配置打印到 log 里会很长；默认关闭，只保留关键日志。
  log_config_on_load: true

# 观察到总batch增加后，准确率大幅上升
trainer_settings:
  dl_settings:
    epochs: 1
    batch_size: 2
    gradient_accumulation_steps: 4
    # 序列最大长度（LLaVA 1.5: 576 vision tokens + 文本）
    # ScienceQA 等长文本数据集建议 2048，VQAv2 等短文本可用 1024
    max_length: 1024
    optimizers:
      layer_pruners:
        type: "adam"
        lr: 5.0e-05  # 提高学习率，让 pruner 更快学习
        weight_decay: 0.01  # 防止过拟合
      discriminator:
        type: "adam"
        lr: 1.0e-04
      # 学习率调度器配置
      lr_scheduler:
        type: "cosine"  # 'none', 'cosine', 'linear'
        warmup_ratio: 0.1  # warmup 步数占总步数的比例
        min_lr_ratio: 0.1  # 最小学习率 = 初始学习率 * min_lr_ratio
    print_loss_every_batches: 20  # 隔多久打印一次损失
    eval_loss_every_batches: 100  # 隔多久计算一次 eval loss（用于检测过拟合）
    eval_every_batches: 100000  # 隔多久评估一次（计算 accuracy）
    # TODO(2026-02-28): 目前 hard eval/generate 路径尚未接入 delayed repair adapter，
    # accuracy 不能反映 repair 的收益；先把评估样本数改成 1 作为占位，避免浪费时间/误导判断。
    eval_max_samples: 10000000 # 每次评估使用多少数据（占位）
    save_every_batches: 2000 # 隔多久保存一个checkpoint
    grad_clip_max_norm: null

dataset_settings:
  name: "vqa-vqav2"
  split:
    train: 50000
    test: 5000
  fast_load_no_random: false
  category_priority:
    enable: false
    values:
      - {train: 'mean'}    # 训练集均衡各类别数量（防止过拟合到高频类别）
      - {test: 'mean'}   # 测试集保持原始比例

backbone_settings:
  name: "llava-1.5-7b"

method_settings:
  # ==================== 剪枝层配置 ====================
  # 剪枝器和判别器是配套的，每个剪枝层都有一个判别器
  # pruning_layers: [1,13,25]
  pruning_layers: [4,14,24]

  # ==================== Pruner 配置 ====================
  # CrossAttentionPruner: 使用可学习 queries 评估 vision tokens 重要性
  pruner_d_internal: 512   # 内部特征维度
  pruner_n_heads: 4        # Cross-attention 头数
  pruner_n_queries: 16      # Pruning queries 数量（更多 = 更多"看图角度"，成本增加很小）
  pruner_dropout: 0.2
  pruner_query_dropout: 0.2  # Query-wise dropout，防止过拟合
  use_question_condition: true  # 是否使用 question embedding 条件化 pruner

  # Gumbel noise 模式配置
  # - "always": 始终使用 Gumbel noise（有随机性，训练和推理可能不一致）
  # - "never": 始终不使用 Gumbel noise（纯 STE，训练和推理完全一致）
  # - "hybrid": 混合三阶段策略（推荐）
  #     阶段1 探索期 (0% - phase1_end): 温度退火 + Gumbel noise，探索哪些 token 重要
  #     阶段2 稳定期 (phase1_end - phase2_end): 低温 + Gumbel noise，精细化决策
  #     阶段3 对齐期 (phase2_end - 100%): 低温 + 关闭 noise，训练推理一致
  gumbel_mode: "hybrid"

  # 跳过阶段1，直接从阶段2开始（用于恢复训练或快速实验）
  # 启用后：温度直接使用低温，稀疏度直接使用目标值（不退火）
  skip_phase1: false

  # 混合模式三阶段配置（仅 gumbel_mode="hybrid" 时生效）
  hybrid_phase1_end: 0.6    # 探索期结束点（占总步数比例）
  hybrid_phase2_end: 0.8    # 稳定期结束点，之后进入对齐期（关闭 noise）
  hybrid_phase1_temp_start: 1.5   # 探索期起始温度
  hybrid_phase1_temp_end: 0.2     # 探索期结束温度（也是稳定期和对齐期温度）

  # ==================== 对抗训练（禁用） ====================
  # 当前训练：不使用判别器；用 teacher keep-all 前向作为 source 分布，
  # 在 gen_answer token 区域做“分布级对齐”的 repair loss。
  adversarial_mode: "none"  # "none" | "discriminator" | "mse"(legacy)

  # ==================== MSE 模式配置 ====================
  # 仅在 adversarial_mode="mse" 时生效
  # MSE 损失类型：
  # - "mse": 均方误差 (默认)
  # - "l1": L1 距离（更鲁棒）
  # - "smooth_l1": Smooth L1（结合 MSE 和 L1 的优点）
  # - "cosine": 余弦相似度损失 (1 - cosine_similarity)
  mse_loss_type: "mse"
  # 是否对特征进行归一化后再计算 MSE（可以让不同层的 loss 量级一致）
  mse_normalize: false
  # MSE 损失权重（如果不设置，则使用 adv_loss_weight）
  mse_loss_weight: 10.0

  # Discriminator 配置（仅在 adversarial_mode="discriminator" 时生效）
  disc_d_d: 512
  disc_dropout: 0.1
  disc_use_spectral_norm: false  # 谱归一化（提高训练稳定性）
  disc_loss_type: hinge            # 损失类型: bce, wgan, hinge
  disc_gp_weight: 10.0           # WGAN-GP 梯度惩罚权重

  # 判别器重初始化配置
  disc_reinit_enable: false       # 是否启用判别器重新初始化
  disc_reinit_mode: random     # 重初始化模式: threshold(准确率阈值) 或 random(随机概率)
  disc_reinit_threshold: 0.97     # threshold 模式：准确率超过此阈值时重新初始化
  disc_reinit_prob: 0.001          # random 模式：每步重初始化的概率

  # ==================== 旧版 Adapter（禁用） ====================
  # 旧版 adapter 是“同层、attn output 立即修复”，与我们当前的 delayed repair 方案不一致；
  # 这里关闭，避免训练时引入不受控的破坏性映射。
  use_adapter: false

  # Adapter 补偿剪枝后的信息损失
  # - simple: 简单 MLP adapter
  # - lightweight: Mask-Aware FiLM adapter（轻量级，根据剪枝 pattern 动态调整）
  adapter_type: lightweight
  adapter_bottleneck: 512         # adapter 瓶颈维度（统一 adapter 模式）
  adapter_alpha_init: 0.1         # adapter 输出缩放初始化
  adapter_delta_weight: 0.001     # 保留字段（use_adapter=false 时无效）

  # Mask encoder 类型
  # - attention: Attention 池化（更轻量，保留空间信息）
  # - linear: 原始 Linear encoder（向后兼容）
  mask_encoder_type: attention
  adapter_dropout: 0.2  # 保留字段（use_adapter=false 时无效）

  # 被剪枝信息：是否使用被剪枝 token 的信息来补偿
  use_pruned_info: true  # 启用后，Adapter 会接收被剪枝 tokens 的聚合表示

  # 分离式 Adapter：为 vision/text tokens 使用独立的 Adapter
  # text_adapter 同时处理 question 和 answer tokens
  use_separated_adapters: false   # 保留字段（use_adapter=false 时无效）
  vision_adapter_bottleneck: 512  # vision tokens adapter 瓶颈维度
  text_adapter_bottleneck: 512    # text tokens adapter 瓶颈维度（包含 question 和 answer）

  # Adversarial Loss 梯度控制
  # 如果为 true，adv_loss 只传导到 adapter，不传导到 pruner
  # 这样 pruner 只受 task_loss 和 sparsity_loss 监督
  # 注意：我们现在没有对抗训练；这个开关如果为 true，会把 vision mask 在 attention 里 detach，
  # 导致 pruner 基本收不到 task_loss 的梯度（只剩 sparsity_loss）。
  # delayed repair 的梯度已经通过 repair_detach_input 与 pruner 解耦，所以这里建议关掉。
  detach_adv_from_pruner: false

  # ==================== Delayed Repair Adapter（语言侧，仅 gen_answer tokens）====================
  # 机制：
  # - pruning layer（如 L4/L14/L24）缓存 repair context（mask_emb/pruned_emb，低维）
  # - repair layer（可配置）仅对 gen_answer token 做修复
  use_repair_adapter: true
  # repair 插入点（你要的“三段修复”默认设置）
  # L4 之后：修复点放在 13
  # L14 之后：修复点放在 22
  # L24 之后：修复点放在 29
  repair_layers: [12, 22, 29]
  # repair 上下文来源（与 repair_layers 一一对应）
  repair_source_layers: [4, 14, 24]
  repair_bottleneck_dim: 512
  repair_dropout: 0.0
  repair_mask_encoder_type: attention
  repair_use_pruned_info: true
  repair_alpha_init: 0.1
  # 更强监督通路：repair_loss 允许经由 base hidden_states 回流到 pruner（更强但可能更不稳定）
  repair_detach_input: false

  # teacher 前向（每 step 一次）：keep_all 作为 source 分布
  teacher_forward_enable: true
  teacher_pruning_mode: keep_all

  # repair loss（分布级对齐，而非点到点对齐）
  repair_loss_weight: 3.0
  repair_loss_type: mean_var   # mean_var | mse
  repair_var_weight: 3.0

  # ==================== Pruner Warmup ====================
  pruner_warmup_ratio: 0  # 前 10% 步数不做对抗训练

  # ==================== 剪枝目标 ====================
  target_token_num: 192  # 目标保留的 vision token 数量
  # 剪枝目标退火：从 100% 保留逐渐退火到 target_token_num
  # 0.0 = 不退火，直接使用目标值
  # 0.3 = 前 30% 训练步数进行余弦退火
  sparsity_anneal_ratio: 0.1
  # Sparsity loss 计算模式：
  # - 'exact': 精确加权平均，梯度比例约 14:3.7:1
  # - 'harmonic': 调和平均近似，梯度比例约 4:1.4:1（更均匀）
  sparsity_loss_mode: 'exact'

  # ==================== Temperature 配置 ====================
  # 注意：如果使用 gumbel_mode="hybrid"，温度由 hybrid_phase* 参数控制
  # 以下配置仅在 gumbel_mode="always" 或 "never" 时生效
  temperature: 1.5
  temperature_min: 0.1
  temperature_anneal_rate: 0.5
  # 评估时使用的温度（应与训练结束时的温度一致）
  eval_temperature: 0.2
  # 评估时的剪枝阈值（sigmoid 后的阈值，默认 0.5）
  # 降低阈值会保留更多 token，提高阈值会剪掉更多 token
  eval_pruning_threshold: 0.5

  # ==================== 损失权重 ====================
  # task_loss: Cross entropy on answer tokens
  # adv_loss: 让 fake 被判为 real
  # sparsity_loss: 约束保留率到目标值

  task_loss_weight: 1.5
  adv_loss_weight: 1.0
  sparsity_weight: 40.0   # 提高到 5.0，让 sparsity loss 有足够影响力
  entropy_weight: 0    # Entropy 正则：鼓励 logits 生成极端值，使训练和推理行为一致
  # Per-Pruner Tightening: 惩罚每个 pruner 的保留率，使其倾向于剪掉更多 tokens
  # 可以是单个值（所有层相同）或 list（对应 pruning_layers 的每一层）
  # 例如 pruning_layers: [4, 14, 24] 时，tightening_weights: [0.1, 0.2, 0.3]
  tightening_weights: []  # 空 list 表示不启用

  # # 动态权重调度 (可选)
  # loss_weight_warmup_ratio: 0.0  # 0 表示不使用 warmup
  # task_loss_weight_start: 1.0
  # adv_loss_weight_start: 0.7

  # # Sparsity warmup - 启用，逐渐增加 sparsity 约束
  # sparsity_warmup_enable: false
  # sparsity_warmup_ratio: 0.3  # 前 30% 训练步数进行 warmup
  # sparsity_weight_max: 0.5   # warmup 结束后达到 10.0

evaluation_settings:
  eval_mode: ["origin", "hard_forward"]
