# Attention Consistency Pruning 配置文件
# 基于 attention 聚合一致性的视觉 token 剪枝

global_settings:
  seed: 42
  device: "cuda"
  dtype: "bfloat16"
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  dataset_cache_dir: "/data/users/zjw/dataset_cache"
  hf_cache_dir: "/data/users/zjw/huggingface_cache"
  save_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  # Checkpoint 路径（用于恢复训练或评估）
  # 训练时：如果指定则从该 checkpoint 恢复训练
  # 评估时：必须指定，否则报错（也可通过命令行 --checkpoint 覆盖）
  checkpoint: /data/users/zjw/projects/domain-adaptation-token-pruning/outputs/checkpoints/checkpoint_step26000.pt  # 例如: "./outputs/checkpoints/checkpoint_final.pt"

trainer_settings:
  dl_settings:
    epochs: 1
    batch_size: 8
    # 序列最大长度（LLaVA 1.5: 576 vision tokens + 文本）
    # ScienceQA 等长文本数据集建议 2048，VQAv2 等短文本可用 1024
    max_length: 1024
    optimizers:
      layer_pruners:
        type: "adam"
        lr: 5.0e-05  # 提高学习率，让 pruner 更快学习
        weight_decay: 0.01  # 防止过拟合
      discriminator:
        type: "adam"
        lr: 2.0e-04
    print_loss_every_batches: 50  # 隔多久打印一次损失
    eval_every_batches: 2000  # 隔多久评估一次
    eval_max_samples: 20000000 # 每次评估使用多少数据
    save_every_batches: 2000 # 隔多久保存一个checkpoint
    grad_clip_max_norm: null # 不要开

dataset_settings:
  name: "vqa-vqav2"
  split:
    train: "all"
    test: "all"
  fast_load_no_random: false
  category_priority:
    enable: true
    values:
      - {train: 'mean'}    # 训练集均衡各类别数量（防止过拟合到高频类别）
      # - {test: 'mean'}   # 测试集保持原始比例

backbone_settings:
  name: "llava-1.5-7b"

method_settings:
  # ==================== 剪枝层配置 ====================
  # 剪枝器和判别器是配套的，每个剪枝层都有一个判别器
  pruning_layers: [4,14,24]

  # ==================== Pruner 配置 ====================
  # CrossAttentionPruner: 使用可学习 queries 评估 vision tokens 重要性
  pruner_d_internal: 512   # 内部特征维度
  pruner_n_heads: 4        # Cross-attention 头数
  pruner_dropout: 0.15

  # 推理时的剪枝阈值（概率空间，0-1）
  # 保留概率 > threshold 时保留 token
  # 0.5 = 与训练时行为一致
  # 0.6 = 更严格（保留更少），0.4 = 更宽松（保留更多）
  pruner_thresholds:
    4: 0.4
    14: 0.4
    24: 0.4

  # 推理模式配置
  # - threshold: 使用 sigmoid(logits) > threshold 判断
  # - topk: 保留 top-k 个 token（根据训练统计设置 k）
  pruner_inference_mode: threshold

  # topk 模式下每层保留的 token 数量
  # 根据训练时的统计结果设置，训练结束时会输出建议值
  pruner_topk_ks:
    4: 151    # 示例值，需根据训练统计调整
    14: 211
    24: 284

  # ==================== Discriminator 配置 ====================
  # 每个 answer token 独立判别
  disc_d_d: 512
  disc_dropout: 0.2
  disc_use_spectral_norm: true  # 谱归一化（提高训练稳定性）
  disc_loss_type: hinge            # 损失类型: bce, wgan, hinge
  disc_gp_weight: 10.0           # WGAN-GP 梯度惩罚权重

  # 判别器重初始化配置
  disc_reinit_enable: true       # 是否启用判别器重新初始化
  disc_reinit_mode: random     # 重初始化模式: threshold(准确率阈值) 或 random(随机概率)
  disc_reinit_threshold: 0.95     # threshold 模式：准确率超过此阈值时重新初始化
  disc_reinit_prob: 0.001          # random 模式：每步重初始化的概率

  # ==================== Adapter 配置 ====================
  # Adapter 补偿剪枝后的信息损失
  # - simple: 简单 MLP adapter
  # - lightweight: Mask-Aware FiLM adapter（轻量级，根据剪枝 pattern 动态调整）
  adapter_type: lightweight
  adapter_bottleneck: 512         # adapter 瓶颈维度

  # ==================== Pruner Warmup ====================
  pruner_warmup_ratio: 0.05  # 前 10% 步数不做对抗训练

  # ==================== 剪枝目标 ====================
  target_token_num: 144  # 目标保留的 vision token 数量

  # ==================== Temperature 配置 ====================
  # Gumbel-Softmax 温度，控制决策的"软硬"程度
  temperature: 1.0
  temperature_min: 0.1
  temperature_anneal_rate: 0.8

  # ==================== 损失权重 ====================
  # task_loss: Cross entropy on answer tokens
  # adv_loss: 让 fake 被判为 real
  # sparsity_loss: 约束保留率到目标值

  task_loss_weight: 1.3
  # adv_loss_weight: 0.1   # 增加到 1.0，让 pruner 更努力骗过判别器
  adv_loss_weight: 0
  sparsity_weight: 0.5   # 提高到 5.0，让 sparsity loss 有足够影响力

  # 动态权重调度 (可选)
  loss_weight_warmup_ratio: 0.0  # 0 表示不使用 warmup
  task_loss_weight_start: 1.0
  adv_loss_weight_start: 0.7

  # Sparsity warmup - 启用，逐渐增加 sparsity 约束
  sparsity_warmup_enable: false
  sparsity_warmup_ratio: 0.3  # 前 30% 训练步数进行 warmup
  sparsity_weight_max: 0.5   # warmup 结束后达到 10.0

evaluation_settings:
  eval_mode: ["hard"]

  # 网格搜索配置（用于搜索最优阈值）
  grid_search:
    enable: false  # 是否启用网格搜索
    # 搜索的阈值列表（每层独立搜索，笛卡尔积）
    threshold_values: [0.6, 0.5, 0.7]
