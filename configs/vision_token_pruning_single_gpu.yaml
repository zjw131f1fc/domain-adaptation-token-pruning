# Vision Token Pruning - HF Trainer FSDP Configuration

# 这是使用HF Trainer + FSDP多卡训练的配置示例
# 相比原版，主要变化：
# 1. trainer_settings.name: "hf-trainer"
# 2. 添加 hf_settings 配置（包含FSDP）
# 3. 优化器配置保留（用于parameter groups）

global_settings:
  seed: 42
  device: "cuda"
  dtype: "float"
  pytorch_cuda_alloc_conf: "expandable_segments:True"
  dataset_cache_dir: "/data/users/zjw/dataset_cache"
  hf_cache_dir: "/data/users/zjw/huggingface_cache"
  save_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  study_name: "gan_vtp_fsdp"
  experiment_tag: "fsdp_test"

trainer_settings:
  type: "deep-learning"
  name: "hf-trainer"  # ✅ 使用HF Trainer

  dl_settings:
    epochs: 1
    batch_size: 4  # per-device batch size

    # 优化器配置（用于创建parameter groups）
    optimizers:
      token_merger:
        type: "adam"
        lr: 1.0e-5
      layer_pruners:
        type: "adam"
        lr: 1.0e-4
      discriminator:
        type: "adam"
        lr: 6.0e-4

  # ✅ HF Trainer专用配置
  hf_settings:
    # 基础训练参数
    gradient_accumulation_steps: 4  # 有效batch = 4 * 4 * num_gpus
    bf16: true  # 使用BF16混合精度
    learning_rate: 1.0e-4  # 基础lr（会被parameter groups覆盖）
    warmup_ratio: 0.1  # warmup 10% steps

    # 日志和保存
    logging_steps: 10
    save_steps: 500
    save_total_limit: 3

    # 优化器
    optim: "adamw_torch"  # 支持parameter groups

    # ✅ FSDP多卡训练配置
    fsdp: "full_shard"  # 完全分片（ZeRO-3）
    # 可选值:
    # - "full_shard": 分片params + grads + optimizer states (ZeRO-3, 最省显存)
    # - "shard_grad_op": 分片grads + optimizer states (ZeRO-2)
    # - "no_shard": 不分片 (类似DDP)

    fsdp_config:
      # Transformer layer类名（用于auto wrap）
      fsdp_transformer_layer_cls_to_wrap: ["LlamaDecoderLayer"]

      # Backward prefetch策略
      fsdp_backward_prefetch: "backward_pre"
      # 可选值:
      # - "backward_pre": 在backward前预取下一层参数
      # - "backward_post": 在backward后预取

      # ✅ CPU offload - 将不活跃的参数offload到CPU
      fsdp_offload_params: true  # 参数offload到CPU
      fsdp_cpu_ram_efficient_loading: true  # 优化加载内存使用

      # 自定义wrap策略（可选）
      # fsdp_min_num_params: 1e8  # 只wrap参数数>1亿的模块

manager_settings:
  name: "basic"
  mode: "direct"
  num_subtasks: 1
  available_gpus: [1, 2, 3]  # ✅ FSDP训练只使用3张GPU
  gpus_per_subtask: 3
  poll_interval: 5.0

dataset_settings:
  name: "vqa-vqav2"
  split:
    train: 5000  # 减少数据量用于快速测试
    test: 500
  category_priority:
    enable: false
  fast_load_no_random: false
  verbose_judge: false

config_settings:
  enable_dict_overrides: true
  enable_yaml_overrides: true
  log_config_on_load: true

backbone_settings:
  type: "mllm"
  name: "llava-1.5-7b"
  mllm_settings:
    device_map: "cpu"  # ✅ FSDP模式下先加载到CPU，避免OOM
    max_text_tokens: 128
    max_vision_tokens: 1600
    image_max_size: 1100
    enable_true_batch: true
    unified_image_size: 336

method_settings:
  # 混合精度训练（BF16由hf_settings控制）
  amp_enabled: true
  amp_dtype: "bfloat16"

  # Token Merger配置
  enable_token_merger: false
  merger_type: "fixed_pooling"
  merge_ratio: 1.0
  merger_dropout: 0.1
  merger_d_internal: 512

  # Layer-wise Pruner配置
  pruning_layers: [5, 10, 15, 20]
  pruner_d_internal: 512
  pruner_num_heads: 4
  pruner_type: "cross_attention"
  pruner_dropout: 0.1
  use_attn_residual: false
  attn_residual_weight: 0.5
  learnable_attn_weight: false

  # 剪枝目标
  use_token_num_target: true
  target_token_num: 200
  target_sparsity: 0.3

  # Sparsity Loss
  sparsity_loss_only_on_excess: true
  sparsity_weight: 9
  sparsity_warmup_enable: false
  token_count_loss_weight: 0
  binarization_loss_weight: 1

  # Temperature Annealing
  temperature: 0.4
  temperature_min: 0.15
  temperature_anneal_rate: 0.5

  # Hard Pruning
  hard_pruning_threshold: 0.5

  # Generator配置
  gen_num_layers: 2
  gen_num_heads: 2
  gen_d_ff: 2048
  gen_use_pos_encoding: false
  gen_enable_token_bias: true
  gen_use_gumbel: true
  gen_temperature: 0.906
  gen_temperature_anneal: true
  gen_temperature_min: 0.237
  gen_temperature_anneal_rate: 0.543

  # Discriminator配置
  disc_num_layers: 3
  disc_d_d: 512
  disc_noise_scale_start: 0.05
  disc_noise_scale_end: 0.01
  disc_noise_scale: 0.0
  disc_pool_start_weight: 0.3
  disc_pool_end_weight: 1.0
  disc_target_layers: [-2, -5, -8]
  disc_reinit_prob: 0.05
  disc_use_spectral_norm: false

  # 损失权重（动态调度）
  task_loss_weight_start: 60.0
  task_loss_weight: 40.0
  adv_loss_weight_start: 10.0
  adv_loss_weight: 40
  entropy_weight: 12.0
  loss_weight_warmup_ratio: 0.3

evaluation_settings:
  eval_mode: ["origin", "hard"]
  eval_use_gumbel: false
